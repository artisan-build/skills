name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Validate repo structure
        run: bash scripts/validate-repo.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check plugin version is in sync
        run: node scripts/sync-plugin-version.mjs --check
